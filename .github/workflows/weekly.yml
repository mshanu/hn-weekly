name: weekly-digest

on:
  schedule:
    - cron: "30 2 * * 1"   # Monday 02:30 UTC = 08:00 IST
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to build, e.g. 2026-W43 (blank = previous week)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Kolkata
      OUTPUT_DIR: site
      DATA_DIR: /tmp/hn-weekly-data   # stage JSON lives here only during the run (runner is discarded)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build digest
        run: |
          ARGS="--if-missing --no-open"
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          uv run python -m hn_weekly $ARGS

      - name: Commit new page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/*.html
          if git diff --cached --quiet; then
            echo "No new page."
          else
            git commit -m "digest: $(git diff --cached --name-only | grep -o "[0-9]*-W[0-9]*" | head -1)"
            git push
          fi

      # Audio lives in GitHub Releases (free, outside git history), not in the repo.
      - name: Publish new audio as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in site/audio/*.mp3; do
            [ -e "$f" ] || continue
            w=$(basename "$f" .mp3)
            gh release view "digest-$w" >/dev/null 2>&1 || \
              gh release create "digest-$w" "$f" --title "HN Weekly $w" --notes "2-minute audio bulletin for $w."
          done

      - name: Fetch the last 12 weeks of audio for the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/audio
          for tag in $(gh release list --limit 12 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -p '*.mp3' -D site/audio --skip-existing
          done
          ls -la site/audio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
